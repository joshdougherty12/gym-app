<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121416" />
    <meta name="description" content="Personal training, fat-loss and progress tracker. Local only." />
    <title>Cutline</title>
    <script>
      // Apply the theme before first paint to avoid a flash. The app corrects
      // it once settings load; this only reads a cached copy.
      try {
        var t = localStorage.getItem('cutline-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && !matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
